server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static frontend only. /api never reaches this server; the proxy routes it to the backend.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
