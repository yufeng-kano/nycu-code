# Application tier: Flask on gunicorn. Reaches PostgreSQL through the `db` Service name.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  type: ClusterIP
  selector: {app: api}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: hw3/api:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PGHOST
              value: db
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_PASSWORD}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_DB}}
          # /api/health runs SELECT 1, so the Pod is only Ready while the database is reachable.
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          # Liveness only checks the process; a database outage must not restart the api.
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
